### Debian bookworm preseed generated by Valete Preseeder ###
# Generate your own on preseeder.valete.fr

## locales

d-i debian-installer/country string IL

## accounts

# Skip creation of a normal user account.
d-i passwd/make-user boolean true

d-i passwd/user-fullname string user

d-i passwd/username string user

# Force the installer to prompt for the password
d-i passwd/user-password password 
d-i passwd/user-password-again password 
d-i passwd/user-password seen false
d-i passwd/user-password-again seen false

## Clock and timezone

d-i time/zone select Asia/Jerusalem

# Controls whether to use NTP to set the clock during the install
d-i clock-setup/ntp boolean true

## Partitioning

# If the system has free space you can choose to only partition that space. This is only honoured if partman-auto/method (below) is not set.
d-i partman-auto/init_automatically_partition select all

## Boot loader

# This is fairly safe to set, it makes grub install automatically to the UEFI partition/boot record if no other operating system is detected on the machine.
d-i grub-installer/only_debian boolean true

